<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LexiLoop logo mark</title>
  <desc id="desc">Two layered vocabulary cards with a centered orbit and an orange recall point.</desc>

  <defs>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="160" height="160" rx="36" fill="#F5F7FF"/>

  <!-- The orbit sits behind the cards to preserve a clean reading order. -->
  <ellipse
    cx="80"
    cy="79"
    rx="59"
    ry="36"
    transform="rotate(-23 80 79)"
    stroke="#A5B4FC"
    stroke-width="7"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Supporting card -->
  <rect
    x="35"
    y="18"
    width="80"
    height="104"
    rx="19"
    transform="rotate(-8 35 18)"
    fill="#818CF8"
  />

  <!-- Primary vocabulary card -->
  <rect
    x="51"
    y="27"
    width="78"
    height="104"
    rx="19"
    transform="rotate(5 51 27)"
    fill="#4F46E5"
    filter="url(#card-shadow)"
  />

  <!-- Vocabulary lines -->
  <rect
    x="68"
    y="55"
    width="43"
    height="7"
    rx="3.5"
    transform="rotate(5 68 55)"
    fill="#FFFFFF"
  />
  <rect
    x="66"
    y="74"
    width="51"
    height="7"
    rx="3.5"
    transform="rotate(5 66 74)"
    fill="#C7D2FE"
  />
  <rect
    x="65"
    y="93"
    width="32"
    height="7"
    rx="3.5"
    transform="rotate(5 65 93)"
    fill="#FDBA74"
  />

  <!-- Recall point -->
  <circle
    cx="130"
    cy="47"
    r="10"
    fill="#EA580C"
    stroke="#F5F7FF"
    stroke-width="4"
  />
</svg>
